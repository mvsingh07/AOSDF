    <rect x="267" y="187" width="44" height="44" rx="11" fill="#fff4df"/>
    <g transform="translate(271 191) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#a35d0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5 32 30H4zM18 14v7m0 5h.01"/></g></g>
    <text x="321" y="202" class="node-title">Triage</text>
    <text x="321" y="223" class="node-detail">Find the boundary</text>
  </g><g role="group" aria-label="Overload: Limit intake">
    <rect x="480" y="125" width="188" height="78" rx="13" fill="#fff" stroke="#cec1ee" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="480" y="125" width="5" height="78" rx="2.5" fill="#7152ba"/>
    <rect x="493" y="142" width="44" height="44" rx="11" fill="#f1ecfc"/>
    <g transform="translate(497 146) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#7152ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 4 29 9v9c0 8-5 12-11 15C12 30 7 26 7 18V9zM13 18l4 4 7-8"/></g></g>
    <text x="547" y="157" class="node-title">Overload</text>
    <text x="547" y="178" class="node-detail">Limit intake</text>
  </g><g role="group" aria-label="Poison job: Isolate + fix">
    <rect x="480" y="260" width="188" height="78" rx="13" fill="#fff" stroke="#f1bac9" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="480" y="260" width="5" height="78" rx="2.5" fill="#b3445f"/>
    <rect x="493" y="277" width="44" height="44" rx="11" fill="#fff0f3"/>
    <g transform="translate(497 281) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#b3445f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5 32 30H4zM18 14v7m0 5h.01"/></g></g>
    <text x="547" y="292" class="node-title">Poison job</text>
    <text x="547" y="313" class="node-detail">Isolate + fix</text>
  </g><g role="group" aria-label="Recovery: Verify results">
    <rect x="706" y="170" width="188" height="78" rx="13" fill="#fff" stroke="#a9ddd4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="706" y="170" width="5" height="78" rx="2.5" fill="#087f79"/>
    <rect x="719" y="187" width="44" height="44" rx="11" fill="#e4f7f3"/>
    <g transform="translate(723 191) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M29 13a11 11 0 0 0-19-4L6 13m0-7v7h7M7 23a11 11 0 0 0 19 4l4-4m0 7v-7h-7"/></g></g>
    <text x="773" y="202" class="node-title">Recovery</text>
    <text x="773" y="223" class="node-detail">Verify results</text>
  </g>
    <rect x="28" y="342" width="864" height="43" rx="9" fill="#e9f3fb"/>
    <text x="43" y="368" class="note-key">KEY IDEA</text><text x="125" y="368" class="note">Use operation state for exact outcomes; broker counts are approximate signals.</text>
  </svg>