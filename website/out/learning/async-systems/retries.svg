<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920" height="402" viewBox="0 0 920 402" role="img" aria-labelledby="title desc">
    <title id="title">Retry, then quarantine</title><desc id="desc">A claimed job calls a dependency. Success persists a result. Transient failure retries with backoff; repeated failure enters a dead-letter queue.</desc>
    <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dbe7f4" stroke-width=".65"/></pattern><filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e3b58" flood-opacity=".09"/></filter><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1.5 8 4.5 1 7.5" fill="none" stroke="#1466b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1.5 8 4.5 1 7.5" fill="none" stroke="#087f79" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1.5 8 4.5 1 7.5" fill="none" stroke="#7152ba" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1.5 8 4.5 1 7.5" fill="none" stroke="#a35d0c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1.5 8 4.5 1 7.5" fill="none" stroke="#b3445f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <style>.kicker{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:1.4px;fill:#3975a8}.heading{font:750 25px Inter,Arial,sans-serif;letter-spacing:-.6px;fill:#142a42}.subtitle{font:400 13px Inter,Arial,sans-serif;fill:#60758c}.node-title{font:700 14px Inter,Arial,sans-serif;fill:#18334d}.node-detail{font:400 11px Inter,Arial,sans-serif;fill:#61778e}.edge-label{font:700 10px Inter,Arial,sans-serif}.note{font:600 13px Inter,Arial,sans-serif;fill:#28516e}.note-key{font:800 10px ui-monospace,Menlo,monospace;letter-spacing:1px;fill:#2676af}</style>
    <rect width="920" height="402" rx="18" fill="#f7faff"/><rect x="1" y="1" width="918" height="400" rx="17" fill="none" stroke="#cbdff1" stroke-width="2"/>
    <rect x="18" y="18" width="884" height="310" rx="12" fill="url(#grid)" opacity=".8"/>
    <text x="38" y="43" class="kicker">SYSTEMS / QUEUES</text>
    <text x="38" y="77" class="heading">Retry, then quarantine</text>
    <text x="38" y="100" class="subtitle">Classify the failure and limit the attempt budget.</text>
    <path d="M216 187H248" fill="none" stroke="#1466b2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M442 187H474" fill="none" stroke="#087f79" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M348 226V247" fill="none" stroke="#a35d0c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><path d="M254 292H231V247H122V232" fill="none" stroke="#a35d0c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><path d="M442 292H474" fill="none" stroke="#b3445f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rose)"/><path d="M668 292H700" fill="none" stroke="#7152ba" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-violet)"/>
    
    <g role="group" aria-label="Claim job: Start attempt">
    <rect x="28" y="148" width="188" height="78" rx="13" fill="#fff" stroke="#aed5f4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="28" y="148" width="5" height="78" rx="2.5" fill="#1466b2"/>
    <rect x="41" y="165" width="44" height="44" rx="11" fill="#e8f3ff"/>
    <g transform="translate(45 169) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#1466b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="8" width="24" height="20" rx="4"/><path d="M13 17l-3 3 3 3m10-6 3 3-3 3M17 25l3-10"/></g></g>
    <text x="95" y="180" class="node-title">Claim job</text>
    <text x="95" y="201" class="node-detail">Start attempt</text>
  </g><g role="group" aria-label="Call store: Bounded timeout">
    <rect x="254" y="148" width="188" height="78" rx="13" fill="#fff" stroke="#cec1ee" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="254" y="148" width="5" height="78" rx="2.5" fill="#7152ba"/>
    <rect x="267" y="165" width="44" height="44" rx="11" fill="#f1ecfc"/>
    <g transform="translate(271 169) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#7152ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="18" cy="9" rx="11" ry="4"/><path d="M7 9v18c0 2 5 4 11 4s11-2 11-4V9M7 18c0 2 5 4 11 4s11-2 11-4"/></g></g>
    <text x="321" y="180" class="node-title">Call store</text>
    <text x="321" y="201" class="node-detail">Bounded timeout</text>
  </g><g role="group" aria-label="Success: Persist + ack">
    <rect x="480" y="148" width="188" height="78" rx="13" fill="#fff" stroke="#a9ddd4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="480" y="148" width="5" height="78" rx="2.5" fill="#087f79"/>
    <rect x="493" y="165" width="44" height="44" rx="11" fill="#e4f7f3"/>
    <g transform="translate(497 169) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 4 29 9v9c0 8-5 12-11 15C12 30 7 26 7 18V9zM13 18l4 4 7-8"/></g></g>
    <text x="547" y="180" class="node-title">Success</text>
    <text x="547" y="201" class="node-detail">Persist + ack</text>
  </g><g role="group" aria-label="Retry: Backoff + jitter">
    <rect x="254" y="253" width="188" height="78" rx="13" fill="#fff" stroke="#f0d39b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="254" y="253" width="5" height="78" rx="2.5" fill="#a35d0c"/>
    <rect x="267" y="270" width="44" height="44" rx="11" fill="#fff4df"/>
    <g transform="translate(271 274) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#a35d0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M29 13a11 11 0 0 0-19-4L6 13m0-7v7h7M7 23a11 11 0 0 0 19 4l4-4m0 7v-7h-7"/></g></g>
    <text x="321" y="285" class="node-title">Retry</text>
    <text x="321" y="306" class="node-detail">Backoff + jitter</text>
  </g><g role="group" aria-label="DLQ: Inspect cause">
    <rect x="480" y="253" width="188" height="78" rx="13" fill="#fff" stroke="#f1bac9" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="480" y="253" width="5" height="78" rx="2.5" fill="#b3445f"/>
    <rect x="493" y="270" width="44" height="44" rx="11" fill="#fff0f3"/>
    <g transform="translate(497 274) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#b3445f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5 32 30H4zM18 14v7m0 5h.01"/></g></g>
    <text x="547" y="285" class="node-title">DLQ</text>
    <text x="547" y="306" class="node-detail">Inspect cause</text>
  </g><g role="group" aria-label="Replay: Fix, then review">
    <rect x="706" y="253" width="188" height="78" rx="13" fill="#fff" stroke="#cec1ee" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="706" y="253" width="5" height="78" rx="2.5" fill="#7152ba"/>
    <rect x="719" y="270" width="44" height="44" rx="11" fill="#f1ecfc"/>
    <g transform="translate(723 274) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#7152ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 4 29 9v9c0 8-5 12-11 15C12 30 7 26 7 18V9zM13 18l4 4 7-8"/></g></g>
    <text x="773" y="285" class="node-title">Replay</text>
    <text x="773" y="306" class="node-detail">Fix, then review</text>
  </g>
    <rect x="28" y="342" width="864" height="43" rx="9" fill="#e9f3fb"/>
    <text x="43" y="368" class="note-key">KEY IDEA</text><text x="125" y="368" class="note">A timeout leaves the outcome uncertain; check for an existing effect before replay.</text>
  </svg>