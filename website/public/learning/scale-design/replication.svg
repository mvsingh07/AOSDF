<svg xmlns="http://www.w3.org/2000/svg" width="920" height="402" viewBox="0 0 920 402" role="img" aria-labelledby="title desc">
<title id="title">They solve different constraints</title><desc id="desc">A replica can lag; shards require routing and rebalancing.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071a2b"/><stop offset="1" stop-color="#0c3443"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#65dfc4" stroke-width="1.5"/></marker></defs>
<style>.eyebrow{font:700 13px system-ui,sans-serif;letter-spacing:2.1px;fill:#72e2cd}.heading{font:700 28px system-ui,sans-serif;fill:#f5fbfc}.node{font:700 18px system-ui,sans-serif;fill:#f7fbfc}.sub{font:500 14px system-ui,sans-serif;fill:#b6d6df}.num{font:700 13px system-ui,sans-serif;fill:#07304a}.foot{font:500 16px system-ui,sans-serif;fill:#b6d6df}</style>
<rect width="920" height="402" rx="22" fill="url(#bg)"/><path d="M0 1 H920" stroke="#5dd9c0" stroke-width="3"/><text x="28" y="48" class="eyebrow">COPIES AND SPLITS</text><text x="28" y="91" class="heading">They solve different constraints</text><rect x="28" y="144" width="198" height="142" rx="18" fill="#10263b" stroke="#46758a" stroke-width="1.5"/><circle cx="56" cy="171" r="13" fill="#54d4bd"/><text x="56" y="176" text-anchor="middle" class="num">1</text><text x="46" y="222" class="node">Primary</text><text x="46" y="251" class="sub">Authoritative writes</text><path d="M230 215 H247" stroke="#65dfc4" stroke-width="3" marker-end="url(#arrow)"/><rect x="251" y="144" width="198" height="142" rx="18" fill="#15324a" stroke="#46758a" stroke-width="1.5"/><circle cx="279" cy="171" r="13" fill="#54d4bd"/><text x="279" y="176" text-anchor="middle" class="num">2</text><text x="269" y="222" class="node">Replica</text><text x="269" y="251" class="sub">Async read copy</text><rect x="474" y="144" width="198" height="142" rx="18" fill="#18465a" stroke="#46758a" stroke-width="1.5"/><circle cx="502" cy="171" r="13" fill="#54d4bd"/><text x="502" y="176" text-anchor="middle" class="num">3</text><text x="492" y="222" class="node">Shard A</text><text x="492" y="251" class="sub">Tenant group A</text><rect x="697" y="144" width="198" height="142" rx="18" fill="#1e5b65" stroke="#46758a" stroke-width="1.5"/><circle cx="725" cy="171" r="13" fill="#54d4bd"/><text x="725" y="176" text-anchor="middle" class="num">4</text><text x="715" y="222" class="node">Shard B</text><text x="715" y="251" class="sub">Tenant group B</text><path d="M28 331 H892" stroke="#447081"/><text x="28" y="366" class="foot">A replica can lag; shards require routing and rebalancing.</text></svg>