  </g><g role="group" aria-label="202 + ID: Check progress later">
    <rect x="28" y="255" width="188" height="78" rx="13" fill="#fff" stroke="#aed5f4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="28" y="255" width="5" height="78" rx="2.5" fill="#1466b2"/>
