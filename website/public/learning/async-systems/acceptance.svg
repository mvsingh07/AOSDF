    <text x="95" y="287" class="node-title">202 + ID</text>
    <text x="95" y="308" class="node-detail">Check progress later</text>
  </g><g role="group" aria-label="Result: Completed status">
    <rect x="706" y="255" width="188" height="78" rx="13" fill="#fff" stroke="#a9ddd4" stroke-width="1.5" filter="url(#shadow)"/>
