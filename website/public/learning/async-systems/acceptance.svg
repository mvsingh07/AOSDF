    <text x="773" y="308" class="node-detail">Completed status</text>
  </g>
    <rect x="28" y="342" width="864" height="43" rx="9" fill="#e9f3fb"/>
    <text x="43" y="368" class="note-key">KEY IDEA</text><text x="125" y="368" class="note">A 202 response means the operation can be found later; it does not mean the file exists.</text>
  </svg>