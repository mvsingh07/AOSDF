    <rect x="719" y="272" width="44" height="44" rx="11" fill="#e4f7f3"/>
    <g transform="translate(723 276) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5h11l6 6v19H10zM21 5v6h6M14 18h9m-9 5h9"/></g></g>
