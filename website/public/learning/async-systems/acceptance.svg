    <rect x="254" y="145" width="5" height="78" rx="2.5" fill="#7152ba"/>
    <rect x="267" y="162" width="44" height="44" rx="11" fill="#f1ecfc"/>
    <g transform="translate(271 166) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#7152ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="18" cy="9" rx="11" ry="4"/><path d="M7 9v18c0 2 5 4 11 4s11-2 11-4V9M7 18c0 2 5 4 11 4s11-2 11-4"/></g></g>
    <text x="321" y="177" class="node-title">Operation</text>
    <text x="321" y="198" class="node-detail">Durable status row</text>
