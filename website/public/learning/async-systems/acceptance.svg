    <g transform="translate(497 166) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#a35d0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="7" width="24" height="6" rx="2"/><rect x="6" y="16" width="24" height="6" rx="2"/><rect x="6" y="25" width="24" height="6" rx="2"/></g></g>
    <text x="547" y="177" class="node-title">Queue</text>
    <text x="547" y="198" class="node-detail">Deliver job</text>
  </g><g role="group" aria-label="Worker: Create file">
    <rect x="706" y="145" width="188" height="78" rx="13" fill="#fff" stroke="#a9ddd4" stroke-width="1.5" filter="url(#shadow)"/>
