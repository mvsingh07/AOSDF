<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920" height="402" viewBox="0 0 920 402" role="img" aria-labelledby="title desc">
    <title id="title">A duplicate delivery</title><desc id="desc">Worker A completes a result but loses acknowledgement. The queue redelivers the same operation to Worker B, which sees the result and only acknowledges.</desc>
