    <rect x="18" y="18" width="884" height="310" rx="12" fill="url(#grid)" opacity=".8"/>
    <text x="38" y="43" class="kicker">SYSTEMS / QUEUES</text>
    <text x="38" y="77" class="heading">A duplicate delivery</text>
    <text x="38" y="100" class="subtitle">One logical operation may be delivered more than once.</text>
