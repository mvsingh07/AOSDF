<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920" height="402" viewBox="0 0 920 402" role="img" aria-labelledby="title desc">
    <title id="title">When arrivals outrun workers</title><desc id="desc">Requests arrive at 120 jobs per minute, while workers finish 90 per minute, so the queue grows by 30 per minute.</desc>
    <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dbe7f4" stroke-width=".65"/></pattern><filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e3b58" flood-opacity=".09"/></filter><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1.5 8 4.5 1 7.5" fill="none" stroke="#1466b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1.5 8 4.5 1 7.5" fill="none" stroke="#087f79" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1.5 8 4.5 1 7.5" fill="none" stroke="#7152ba" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1.5 8 4.5 1 7.5" fill="none" stroke="#a35d0c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1.5 8 4.5 1 7.5" fill="none" stroke="#b3445f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <style>.kicker{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:1.4px;fill:#3975a8}.heading{font:750 25px Inter,Arial,sans-serif;letter-spacing:-.6px;fill:#142a42}.subtitle{font:400 13px Inter,Arial,sans-serif;fill:#60758c}.node-title{font:700 14px Inter,Arial,sans-serif;fill:#18334d}.node-detail{font:400 11px Inter,Arial,sans-serif;fill:#61778e}.edge-label{font:700 10px Inter,Arial,sans-serif}.note{font:600 13px Inter,Arial,sans-serif;fill:#28516e}.note-key{font:800 10px ui-monospace,Menlo,monospace;letter-spacing:1px;fill:#2676af}</style>
    <rect width="920" height="402" rx="18" fill="#f7faff"/><rect x="1" y="1" width="918" height="400" rx="17" fill="none" stroke="#cbdff1" stroke-width="2"/>
    <rect x="18" y="18" width="884" height="310" rx="12" fill="url(#grid)" opacity=".8"/>
    <text x="38" y="43" class="kicker">SYSTEMS / QUEUES</text>
    <text x="38" y="77" class="heading">When arrivals outrun workers</text>
    <text x="38" y="100" class="subtitle">A buffer buys time; it does not create processing capacity.</text>
    <path d="M216 201H248" fill="none" stroke="#1466b2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M442 201H474" fill="none" stroke="#a35d0c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><path d="M668 201H700" fill="none" stroke="#087f79" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
    <g><rect x="302" y="259" width="92" height="25" rx="12.5" fill="#fff4df"/><text x="348" y="276" text-anchor="middle" class="edge-label" fill="#a35d0c">20 min → 600</text></g>
    <g role="group" aria-label="Arrivals: 120 jobs / minute">
    <rect x="28" y="162" width="188" height="78" rx="13" fill="#fff" stroke="#aed5f4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="28" y="162" width="5" height="78" rx="2.5" fill="#1466b2"/>
    <rect x="41" y="179" width="44" height="44" rx="11" fill="#e8f3ff"/>
    <g transform="translate(45 183) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#1466b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="26" height="22" rx="4"/><path d="M5 13h26M11 20h5m-5 5h9"/></g></g>
    <text x="95" y="194" class="node-title">Arrivals</text>
    <text x="95" y="215" class="node-detail">120 jobs / minute</text>
  </g><g role="group" aria-label="Backlog: +30 jobs / minute">
    <rect x="254" y="162" width="188" height="78" rx="13" fill="#fff" stroke="#f0d39b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="254" y="162" width="5" height="78" rx="2.5" fill="#a35d0c"/>
    <rect x="267" y="179" width="44" height="44" rx="11" fill="#fff4df"/>
    <g transform="translate(271 183) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#a35d0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="7" width="24" height="6" rx="2"/><rect x="6" y="16" width="24" height="6" rx="2"/><rect x="6" y="25" width="24" height="6" rx="2"/></g></g>
    <text x="321" y="194" class="node-title">Backlog</text>
    <text x="321" y="215" class="node-detail">+30 jobs / minute</text>
  </g><g role="group" aria-label="Workers: 90 jobs / minute">
    <rect x="480" y="162" width="188" height="78" rx="13" fill="#fff" stroke="#a9ddd4" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="480" y="162" width="5" height="78" rx="2.5" fill="#087f79"/>
    <rect x="493" y="179" width="44" height="44" rx="11" fill="#e4f7f3"/>
    <g transform="translate(497 183) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="8" width="24" height="20" rx="4"/><path d="M13 17l-3 3 3 3m10-6 3 3-3 3M17 25l3-10"/></g></g>
    <text x="547" y="194" class="node-title">Workers</text>
    <text x="547" y="215" class="node-detail">90 jobs / minute</text>
  </g><g role="group" aria-label="File store: Capacity limit">
    <rect x="706" y="162" width="188" height="78" rx="13" fill="#fff" stroke="#cec1ee" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="706" y="162" width="5" height="78" rx="2.5" fill="#7152ba"/>
    <rect x="719" y="179" width="44" height="44" rx="11" fill="#f1ecfc"/>
    <g transform="translate(723 183) scale(1)"><g transform="translate(0 0)" fill="none" stroke="#7152ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="18" cy="9" rx="11" ry="4"/><path d="M7 9v18c0 2 5 4 11 4s11-2 11-4V9M7 18c0 2 5 4 11 4s11-2 11-4"/></g></g>
    <text x="773" y="194" class="node-title">File store</text>
    <text x="773" y="215" class="node-detail">Capacity limit</text>
  </g>
    <rect x="28" y="342" width="864" height="43" rx="9" fill="#e9f3fb"/>
    <text x="43" y="368" class="note-key">KEY IDEA</text><text x="125" y="368" class="note">Watch the age of the oldest job; adding workers may overload the file store.</text>
  </svg>